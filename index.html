<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ContactHub - Smart Contact Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="fonts/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- nav -->
    <div class="container max-w-7xl px-3 px-sm-4 d-flex">
        <!-- Brand Logo & Name -->
        <a class="navbar-brand d-flex align-items-center gap-3 my-4" href="#">
            <div class="brand-icon">
                <i class="fa-solid fa-address-book"></i>
            </div>
            <div>
                <div class="brand-title">Contact<span>Hub</span></div>
                <div class="brand-subtitle">Smart Contact Manager</div>
            </div>
        </a>

        <!-- Right Actions -->
        <div class="d-flex align-items-center gap-2 gap-sm-3 ms-auto">
            <!-- Button triggers Modal -->
            <button type="button" class="btn btn-add-contact d-flex align-items-center gap-2" data-bs-toggle="modal"
                data-bs-target="#addContactModal">
                <i class="fa-solid fa-plus me-1"></i> Add Contact
            </button>

            <a href="#" class="nav-icon-btn ms-1" title="Notifications">
                <i class="fa-solid fa-bell"></i>
            </a>

            <a href="#" class="nav-icon-btn" title="Settings">
                <i class="fa-solid fa-gear"></i>
            </a>

            <a href="#" class="ms-1" title="User Profile">
                <img src="img/avatar-2.jpg" alt="User Profile" class="user-avatar">
            </a>
        </div>
    </div>

    <main class="container max-w-7xl px-3 px-sm-4 pb-5">
        <section class="dashboard-main-section">

            <!-- Top Stats Cards -->
            <div class="row g-3 g-md-4 mb-4">
                <!-- Total Card -->
                <div class="col-12 col-md-4">
                    <div class="stat-card d-flex align-items-center gap-3">
                        <div class="stat-icon-wrapper bg-icon-total">
                            <i class="fa-solid fa-user-group"></i>
                        </div>
                        <div>
                            <div class="stat-label">TOTAL</div>
                            <div id="total" class="stat-value">0</div>
                        </div>
                    </div>
                </div>

                <!-- Favorites Card -->
                <div class="col-12 col-md-4">
                    <div class="stat-card d-flex align-items-center gap-3">
                        <div class="stat-icon-wrapper bg-icon-favorites">
                            <i class="fa-solid fa-star"></i>
                        </div>
                        <div>
                            <div class="stat-label">FAVORITES</div>
                            <div id="fav-total" class="stat-value">0</div>
                        </div>
                    </div>
                </div>

                <!-- Emergency Card -->
                <div class="col-12 col-md-4">
                    <div class="stat-card d-flex align-items-center gap-3">
                        <div class="stat-icon-wrapper bg-icon-emergency">
                            <i class="fa-solid fa-heart-pulse"></i>
                        </div>
                        <div>
                            <div class="stat-label">EMERGENCY</div>
                            <div id="eme-total" class="stat-value">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Content Area Layout Grid -->
            <div class="row g-4">
                <!-- Left Main Column (Contacts Overview & Search) -->
                <div class="col-12 col-lg-9">
                    <div class="all-contacts-container">
                        <!-- Section Header -->
                        <div class="mb-3">
                            <h1 class="section-title mb-1">All Contacts</h1>
                            <p class="section-subtitle mb-0">Manage and organize your <span class=""
                                    id="total-1"></span> contacts</p>
                        </div>

                        <!-- Search Input -->
                        <div class="search-box mb-4">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input id="searchInput" type="text" class="form-control search-input"
                                placeholder="Search by name, phone, or email...">
                        </div>

                        <!-- Empty State Box -->
                        <!-- <div class="empty-state-box">
                            <div class="empty-icon-card">
                                <i class="fa-regular fa-address-card"></i>
                            </div>
                            <div class="empty-title">No contacts found</div>
                            <div class="empty-subtitle">Click "Add Contact" to get started</div>
                        </div> -->
                        <div class="col-lg-12">
                            <div id="demo" class="row g-3">

                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Sidebar Column (Favorites & Emergency Cards) -->
                <div class="col-sm-12 col-lg-3">
                    <div class="sidebar-shortcuts-container d-flex flex-column gap-4">
                        <!-- Favorites Card -->
                        <div class="sidebar-card">
                            <div class="sidebar-header-fav d-flex align-items-center gap-3">
                                <div class="sidebar-icon bg-icon-favorites">
                                    <i class="fa-solid fa-star"></i>
                                </div>
                                <div>
                                    <div class="sidebar-title">Favorites</div>
                                    <div class="sidebar-subtitle">Quick access to starred contacts</div>
                                </div>
                            </div>
                            <div id="fav" class="sidebar-body">
                                <span class="d-none">No favorites yet</span>

                            </div>
                        </div>

                        <!-- Emergency Card -->
                        <div class="sidebar-card">
                            <div class="sidebar-header-emerg d-flex align-items-center gap-3">
                                <div class="sidebar-icon bg-icon-emergency">
                                    <i class="fa-solid fa-heart-pulse"></i>
                                </div>
                                <div>
                                    <div class="sidebar-title">Emergency</div>
                                    <div class="sidebar-subtitle">Important contacts for urgent calls</div>
                                </div>
                            </div>
                            <div id="eme-card" class="sidebar-body">
                               <span class="d-none">No emergency contacts</span> 
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>
    <!-- Modal -->
    <div class="modal fade" id="addContactModal" tabindex="-1" aria-labelledby="addContactModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 p-2 p-sm-3">

                <!-- Modal Header -->
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold" id="addContactModalLabel">Add New Contact</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>

                <!-- Modal Body -->
                <div class="modal-body modal-edit pt-3 pb-2">
                    <form id="addContactForm">

                        <!-- Avatar Upload Area -->
                        <div class="text-center mb-4">
                            <div class="mx-auto rounded-circle d-flex align-items-center justify-content-center mb-2"
                                style="width: 80px; height: 80px; background-color: #4f46e5;">
                                <i class="fa-solid fa-user text-white fs-2"></i>
                            </div>
                            <label for="contactPhotoInput"
                                class="btn btn-sm btn-light border text-secondary rounded-pill px-3 py-1 shadow-sm fs-7"
                                style="cursor: pointer;">
                                <i class="fa-solid fa-camera me-1"></i> Change Photo
                            </label>
                            <input type="file" id="contactPhotoInput" class="d-none" accept="image/*" />
                        </div>

                        <!-- Full Name -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark mb-1">
                                Full Name <span class="text-danger">*</span>
                            </label>
                            <input id="fullName" type="text" class="form-control form-control-lg fs-6 rounded-3"
                                placeholder="Enter full name" required />
                        </div>

                        <!-- Phone Number -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark mb-1">
                                Phone Number <span class="text-danger">*</span>
                            </label>
                            <input id="phoneNumber" type="tel" class="form-control form-control-lg fs-6 rounded-3"
                                placeholder="e.g., 01012345678" required />
                        </div>

                        <!-- Email Address -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark mb-1">
                                Email Address
                            </label>
                            <input id="email" type="email" class="form-control form-control-lg fs-6 rounded-3"
                                placeholder="name@example.com" />
                        </div>

                        <!-- Address -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark mb-1">
                                Address
                            </label>
                            <input id="address" type="text" class="form-control form-control-lg fs-6 rounded-3"
                                placeholder="Enter address" />
                        </div>

                        <!-- Group -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark mb-1">
                                Group
                            </label>
                            <select id="select" class="form-select form-select-lg fs-6 rounded-3 text-secondary">
                                <option value="" selected disabled>Select a group</option>
                                <option value="family">Family</option>
                                <option value="friends">Friends</option>
                                <option value="work">Work</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <!-- Notes -->
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-dark mb-1">
                                Notes
                            </label>
                            <textarea id="notes" class="form-control fs-6 rounded-3" rows="3"
                                placeholder="Add notes about this contact"></textarea>
                        </div>

                        <!-- Checkboxes (Favorite & Emergency) -->
                        <div class="d-flex align-items-center gap-4 mt-3 mb-2 pt-1">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="favoriteCheck" />
                                <label class="form-check-label small fw-semibold text-dark" for="favoriteCheck">
                                    <i class="fa-solid fa-star text-warning me-1"></i> Favorite
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="emergencyCheck" />
                                <label class="form-check-label small fw-semibold text-dark" for="emergencyCheck">
                                    <i class="fa-solid fa-heart-pulse text-danger me-1"></i> Emergency
                                </label>
                            </div>
                        </div>

                    </form>
                </div>

                <!-- Modal Footer -->
                <div class="modal-footer border-0 pt-2 pb-0 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light rounded-3 px-4 fw-semibold text-secondary"
                        data-bs-dismiss="modal">
                        Cancel
                    </button>
                    <button id="btnAdd" type="button" form="addContactForm"
                        class="btn text-white rounded-3 px-4 fw-semibold d-flex align-items-center gap-2"
                        style="background-color: #6366f1; border: none;">
                        <i class="fa-solid fa-check"></i> Save Contact
                    </button>
                    <button id="btnUpdate" type="button" form="addContactForm"
                        class="btn d-none text-white rounded-3 px-4 fw-semibold d-flex align-items-center gap-2"
                        style="background-color: #6366f1; border: none;">
                        <i class="fa-solid fa-check"></i> Save Contact
                    </button>
                </div>

            </div>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="js/bootstrap.bundle.min.js"></script>
<script src="js/index.js"></script>

</html>
